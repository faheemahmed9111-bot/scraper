name: Telegram Bot Poller

on:
  schedule:
    # Runs every 5 minutes to quickly pick up new messages
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  poll-telegram:
    name: Poll Telegram Updates
    runs-on: ubuntu-latest
    
    # Prevent concurrent runs to avoid caching issues with the telegram offset
    concurrency:
      group: telegram-poller-group
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-bot.txt

      - name: Run Telegram Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python telegram_bot.py
